    <path d="M22 10 C22 25 10 32 10 32" stroke="#3F7D3A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M22 20 C22 30 34 35 34 35" stroke="#3F7D3A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Orthopaedic Joint / Bone Intersection Emblem in Burgundy -->
