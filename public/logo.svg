    <tspan fill="#59615D" font-weight="400"> &amp; </tspan>
    <tspan fill="#7A3038">ORTHOPAEDIC</tspan>
    <tspan fill="#59615D" font-weight="400"> SPECIALITY CLINIC</tspan>
  </text>
  
  <text x="74" y="58" font-family="'Source Sans 3', sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.8" fill="#59615D">SINHAGAD ROAD, PUNE</text>
